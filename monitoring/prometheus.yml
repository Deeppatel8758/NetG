global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # NetGuard application metrics
  - job_name: "netguard"
    static_configs:
      - targets: ["netguard:8080"]
    metrics_path: /metrics
    scrape_interval: 15s

  # Kafka exporter (if available)
  - job_name: "kafka-exporter"
    static_configs:
      - targets: ["kafka-exporter:9308"]
    scrape_interval: 15s

  # Redis exporter (if available)
  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]
    scrape_interval: 15s

  # Prometheus self-scrape
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
